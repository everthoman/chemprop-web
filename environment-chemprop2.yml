# The separate "chemprop2" environment, exported from the deployment machine
# (2026-09-03). The web app never imports chemprop 2.x; it shells out to this
# environment's CLI for the v2 backend and its foundation models (CheMeleon).
# Optional: without it the Train page simply hides the v2 backend.
#
#   conda env create -f environment-chemprop2.yml
#
# The app finds it at $CONDA_EXE/../envs/chemprop2/bin/chemprop, overridable via
# CHEMPROP2_ENV or CHEMPROP2_BIN.
name: chemprop2
channels:
  - conda-forge
  - bioconda
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r
