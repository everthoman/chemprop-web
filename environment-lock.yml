# Exact versions of the "chemprop" environment that runs the web app, exported
# from the machine it is deployed on (2026-09-03). Use this rather than the
# looser environment.yml when reproducing the deployment on another host:
#
#   conda env create -f environment-lock.yml
#   conda activate chemprop && pip install -e .
#
# chemprop itself is deliberately absent below: it is this repository, installed
# editable by the second command, not a release from PyPI.
name: chemprop
channels:
  - conda-forge
  - defaults
  - pytorch
  - bioconda
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r
